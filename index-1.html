<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1026">
<title>잠드는 피드</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    --navy-deep: #0b1026;
    --navy-mid: #131a35;
    --amber-dim: #2a1f14;
    --amber-glow: #d9a15f;
    --moon: #f4ecd8;
    --ink: #e8e6f0;
    --ink-dim: #9a97b3;
    --story-serif: 'Noto Serif KR', Georgia, serif;
    --ui-sans: 'Pretendard', -apple-system, 'Malgun Gothic', sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; overflow:hidden;}
  body{
    font-family:var(--ui-sans);
    background: var(--navy-deep);
    color:var(--ink);
    transition: background 2.5s ease;
  }
  #app{
    position:relative;
    height:100vh; height:100dvh;
    width:100vw;
    display:flex; flex-direction:column;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
  }

  /* ---------- moon phase progress ---------- */
  .moon-row{ display:flex; gap:10px; justify-content:center; padding:8px 0 4px; }
  .moon{ width:14px; height:14px; border-radius:50%; background:rgba(244,236,216,0.15); transition: background 0.6s ease, box-shadow 0.6s ease; }
  .moon.active{ background: var(--moon); box-shadow:0 0 10px rgba(244,236,216,0.6); }
  .moon.done{ background: rgba(244,236,216,0.55); }

  /* ---------- screens ---------- */
  .screen{ display:none; flex:1; flex-direction:column; }
  .screen.visible{ display:flex; }

  /* start screen */
  #screen-start{ justify-content:center; align-items:center; text-align:center; gap:22px; }
  .brand{ font-family: var(--story-serif); font-size:15px; letter-spacing:0.35em; color:var(--ink-dim); text-transform:uppercase; }
  .title-moon{ font-size:56px; line-height:1; filter: drop-shadow(0 0 18px rgba(244,236,216,0.25)); }
  h1.hero{ font-family:var(--story-serif); font-weight:600; font-size:30px; margin:0; line-height:1.4; }
  p.sub{ color:var(--ink-dim); font-size:14px; line-height:1.7; max-width:280px; margin:0; }
  .setup-list{ width:100%; max-width:320px; display:flex; flex-direction:column; gap:10px; margin-top:6px; }
  .setup-row{ display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:14px; padding:12px 16px; }
  .setup-row label{ font-size:13px; color:var(--ink-dim); }
  .setup-row input[type=number]{ width:52px; background:transparent; border:none; color:var(--ink); font-size:15px; text-align:right; font-family:var(--ui-sans); }
  .content-row{ width:100%; max-width:320px; display:flex; flex-direction:column; gap:8px; text-align:left; }
  .content-row label{ font-size:12px; color:var(--ink-dim); padding-left:2px; }
  .content-row input[type=text]{ background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:10px; padding:10px 12px; color:var(--ink); font-size:13px; }

  button{ font-family:var(--ui-sans); cursor:pointer; }
  .btn-primary{
    margin-top:8px; width:100%; max-width:320px; padding:16px; border-radius:999px; border:none;
    background: linear-gradient(135deg, var(--amber-glow), #b97b3a); color:#1a1206; font-weight:700; font-size:15px;
    letter-spacing:0.02em; box-shadow:0 8px 24px rgba(217,161,95,0.25);
  }
  .btn-ghost{ background:transparent; border:1px solid rgba(255,255,255,0.15); color:var(--ink-dim); border-radius:999px; padding:12px 20px; font-size:13px; }

  /* stage screens */
  .stage-screen{ justify-content:flex-start; }
  .stage-head{ display:flex; align-items:center; justify-content:space-between; padding-top:4px; }
  .stage-eyebrow{ font-size:11px; letter-spacing:0.2em; color:var(--ink-dim); text-transform:uppercase; }
  .stage-timer{ font-variant-numeric:tabular-nums; font-size:13px; color:var(--ink-dim); }
  .stage-name{ font-family:var(--story-serif); font-size:26px; margin:14px 0 6px; }
  .stage-desc{ color:var(--ink-dim); font-size:13px; line-height:1.6; margin-bottom:18px; }
  .stage-body{ flex:1; display:flex; flex-direction:column; }

  .embed-wrap{ flex:1; border-radius:18px; overflow:hidden; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:center; }
  .embed-wrap iframe{ width:100%; height:100%; border:none; }
  .embed-placeholder{ text-align:center; color:var(--ink-dim); font-size:13px; padding:24px; line-height:1.7; }

  /* ambient stage */
  .ambient-canvas{ flex:1; border-radius:18px; position:relative; overflow:hidden; background: radial-gradient(circle at 50% 30%, #1c2650, var(--navy-deep) 70%); }
  .drift{ position:absolute; border-radius:50%; filter:blur(30px); opacity:0.35; animation: drift 18s ease-in-out infinite; }

  @keyframes drift{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(20px,-30px) scale(1.15); }
  }

  /* dark audio stage */
  #screen-stage4{ background:#000; justify-content:center; align-items:center; text-align:center; gap:16px; }
  .pulse-dot{ width:10px; height:10px; border-radius:50%; background:var(--amber-glow); animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:0.25; transform:scale(0.9);} 50%{ opacity:1; transform:scale(1.15);} }
  #screen-stage4 p{ color:#6b6880; font-size:12px; letter-spacing:0.15em; }

  .bottom-actions{ display:flex; gap:10px; padding-top:14px; }
  .bottom-actions button{ flex:1; }

  /* end screen */
  #screen-end{ justify-content:center; align-items:center; text-align:center; gap:14px; }
</style>
</head>
<body>
<div id="app">

  <!-- START -->
  <div id="screen-start" class="screen visible">
    <div class="brand">Landing Feed</div>
    <div class="title-moon">🌙</div>
    <h1 class="hero">오늘 밤도<br>천천히 내려놓을게요</h1>
    <p class="sub">고자극 → 이야기 → 잔잔한 풍경 → 어둠. 네 단계를 지나면 잠들 준비가 돼요.</p>

    <div class="setup-list">
      <div class="setup-row"><label>1단계 · 고자극</label><input type="number" id="dur1" value="5" min="1" max="60"> 분</div>
      <div class="setup-row"><label>2단계 · 이야기</label><input type="number" id="dur2" value="5" min="1" max="60"> 분</div>
      <div class="setup-row"><label>3단계 · 앰비언트</label><input type="number" id="dur3" value="5" min="1" max="60"> 분</div>
      <div class="setup-row"><label>4단계 · 어둠</label><input type="number" id="dur4" value="10" min="1" max="60"> 분</div>
    </div>

    <div class="content-row">
      <label>1단계에 붙일 링크 (평소 보던 숏폼 등, 선택)</label>
      <input type="text" id="link1" placeholder="https://...">
      <label>2단계에 붙일 링크 (이야기·팟캐스트 등, 선택)</label>
      <input type="text" id="link2" placeholder="https://...">
      <label>4단계 오디오 링크 (백색소음·잔잔한 음악, 선택)</label>
      <input type="text" id="link4" placeholder="https://...">
    </div>

    <button class="btn-primary" id="btn-start">지금 시작하기</button>
  </div>

  <!-- STAGE TEMPLATE (1~3) -->
  <div id="screen-stage" class="screen stage-screen">
    <div class="moon-row" id="moon-row"></div>
    <div class="stage-head">
      <div class="stage-eyebrow" id="stage-eyebrow">STAGE 1</div>
      <div class="stage-timer" id="stage-timer">05:00</div>
    </div>
    <div class="stage-name" id="stage-name">고자극</div>
    <div class="stage-desc" id="stage-desc">평소 보던 자극적인 콘텐츠, 여기서 마지막으로 봐요.</div>
    <div class="stage-body" id="stage-body"></div>
    <div class="bottom-actions">
      <button class="btn-ghost" id="btn-skip">다음 단계로</button>
    </div>
  </div>

  <!-- STAGE 4 (dark audio) -->
  <div id="screen-stage4" class="screen">
    <div class="pulse-dot"></div>
    <p id="stage4-timer">10:00 남음 · 오디오만</p>
    <audio id="audio4" loop></audio>
  </div>

  <!-- END -->
  <div id="screen-end" class="screen">
    <div class="title-moon">🌘</div>
    <h1 class="hero">굿나잇</h1>
    <p class="sub">네 단계를 다 지났어요. 이제 화면을 내려놓아도 좋아요.</p>
    <button class="btn-ghost" id="btn-restart">처음으로</button>
  </div>

</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const screens = ['screen-start','screen-stage','screen-stage4','screen-end'];
  function show(id){
    screens.forEach(s => $(s).classList.toggle('visible', s === id));
  }

  const STAGES = [
    { key:'stage1', eyebrow:'STAGE 1 · 05', name:'고자극', desc:'평소 보던 자극적인 콘텐츠, 여기서 마지막으로 봐요.', type:'link' },
    { key:'stage2', eyebrow:'STAGE 2 · 05', name:'이야기', desc:'천천히 흘러가는 이야기나 잔잔한 팟캐스트로 넘어가요.', type:'link' },
    { key:'stage3', eyebrow:'STAGE 3 · 05', name:'앰비언트', desc:'눈으로만 흘려보는 잔잔한 풍경. 아무것도 안 해도 돼요.', type:'ambient' },
  ];

  let config = { durations:[5,5,5,10], links:{1:'',2:'',4:''} };
  let stageIndex = 0;
  let stageEndAt = 0;
  let timerHandle = null;

  function toEmbeddable(url){
    if(!url) return null;
    try{
      const u = new URL(url);
      if(u.hostname.includes('youtube.com') || u.hostname.includes('youtu.be')){
        let id = '';
        if(u.hostname.includes('youtu.be')) id = u.pathname.slice(1);
        else if(u.searchParams.get('v')) id = u.searchParams.get('v');
        else if(u.pathname.includes('/shorts/')) id = u.pathname.split('/shorts/')[1];
        if(id) return `https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1`;
      }
      return url;
    }catch(e){ return null; }
  }

  function renderMoons(){
    const row = $('moon-row');
    row.innerHTML = '';
    for(let i=0;i<4;i++){
      const d = document.createElement('div');
      d.className = 'moon' + (i < stageIndex ? ' done' : (i === stageIndex ? ' active' : ''));
      row.appendChild(d);
    }
  }

  function renderStageBody(stage){
    const body = $('stage-body');
    body.innerHTML = '';
    if(stage.type === 'link'){
      const wrap = document.createElement('div');
      wrap.className = 'embed-wrap';
      const url = config.links[stageIndex+1];
      const embed = toEmbeddable(url);
      if(embed){
        const iframe = document.createElement('iframe');
        iframe.src = embed;
        iframe.allow = 'autoplay; encrypted-media; picture-in-picture';
        iframe.allowFullscreen = true;
        wrap.appendChild(iframe);
      } else {
        const p = document.createElement('div');
        p.className = 'embed-placeholder';
        p.textContent = '여기에 링크를 붙여넣지 않았어요. 시작 화면에서 링크를 넣으면 이 자리에 재생돼요.';
        wrap.appendChild(p);
      }
      body.appendChild(wrap);
    } else if(stage.type === 'ambient'){
      const canvas = document.createElement('div');
      canvas.className = 'ambient-canvas';
      const colors = ['#3a4a8f','#5a3f7a','#2f6a6a'];
      for(let i=0;i<3;i++){
        const d = document.createElement('div');
        d.className = 'drift';
        d.style.width = d.style.height = (140+i*60)+'px';
        d.style.left = (10+i*30)+'%';
        d.style.top = (15+i*20)+'%';
        d.style.background = colors[i];
        d.style.animationDelay = (i*3)+'s';
        canvas.appendChild(d);
      }
      body.appendChild(canvas);
    }
  }

  function startStage(i){
    stageIndex = i;
    if(i >= STAGES.length){
      startStage4();
      return;
    }
    const stage = STAGES[i];
    $('stage-eyebrow').textContent = 'STAGE ' + (i+1);
    $('stage-name').textContent = stage.name;
    $('stage-desc').textContent = stage.desc;
    renderMoons();
    renderStageBody(stage);
    show('screen-stage');
    document.body.style.background = i < 2 ? 'var(--navy-deep)' : 'var(--navy-mid)';

    const durMin = config.durations[i];
    stageEndAt = Date.now() + durMin*60*1000;
    tickStage();
  }

  function tickStage(){
    clearTimeout(timerHandle);
    const remain = Math.max(0, stageEndAt - Date.now());
    const m = String(Math.floor(remain/60000)).padStart(2,'0');
    const s = String(Math.floor((remain%60000)/1000)).padStart(2,'0');
    $('stage-timer').textContent = `${m}:${s}`;
    if(remain <= 0){
      startStage(stageIndex+1);
      return;
    }
    timerHandle = setTimeout(tickStage, 500);
  }

  function startStage4(){
    show('screen-stage4');
    document.body.style.background = '#000';
    const audio = $('audio4');
    if(config.links[4]){
      audio.src = config.links[4];
      audio.play().catch(()=>{});
    }
    if('mediaSession' in navigator){
      navigator.mediaSession.metadata = new MediaMetadata({ title:'잠드는 피드', artist:'Stage 4 · 어둠' });
    }
    const durMin = config.durations[3];
    stageEndAt = Date.now() + durMin*60*1000;
    tickStage4();
  }

  function tickStage4(){
    clearTimeout(timerHandle);
    const remain = Math.max(0, stageEndAt - Date.now());
    const m = String(Math.floor(remain/60000)).padStart(2,'0');
    const s = String(Math.floor((remain%60000)/1000)).padStart(2,'0');
    $('stage4-timer').textContent = `${m}:${s} 남음 · 오디오만`;
    if(remain <= 0){
      finishSequence();
      return;
    }
    timerHandle = setTimeout(tickStage4, 500);
  }

  function finishSequence(){
    $('audio4').pause();
    show('screen-end');
    document.body.style.background = 'var(--navy-deep)';
  }

  $('btn-start').addEventListener('click', () => {
    config.durations = [1,2,3].map(n => n) ; // placeholder overwritten below
    config.durations = [
      parseInt($('dur1').value)||5,
      parseInt($('dur2').value)||5,
      parseInt($('dur3').value)||5,
      parseInt($('dur4').value)||10,
    ];
    config.links = { 1:$('link1').value.trim(), 2:$('link2').value.trim(), 4:$('link4').value.trim() };
    try{ localStorage.setItem('landingfeed_config', JSON.stringify(config)); }catch(e){}
    startStage(0);
  });

  $('btn-skip').addEventListener('click', () => startStage(stageIndex+1));
  $('btn-restart').addEventListener('click', () => { clearTimeout(timerHandle); show('screen-start'); });

  // restore last config
  try{
    const saved = JSON.parse(localStorage.getItem('landingfeed_config'));
    if(saved){
      $('dur1').value = saved.durations[0];
      $('dur2').value = saved.durations[1];
      $('dur3').value = saved.durations[2];
      $('dur4').value = saved.durations[3];
      $('link1').value = saved.links[1]||'';
      $('link2').value = saved.links[2]||'';
      $('link4').value = saved.links[4]||'';
    }
  }catch(e){}

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
</script>
</body>
</html>
